name: bdm-mojo

services:
  mongo_personas:
    image: mongo:7
    container_name: bdm-mongo-personas
    ports:
      - "27017:27017"
    networks:
      - bdm-red
    volumes:
      - mongo_personas:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mongo_articulos:
    image: mongo:7
    container_name: bdm-mongo-articulos
    ports:
      - "27018:27017"
    networks:
      - bdm-red
    volumes:
      - mongo_articulos:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mongo_ventas:
    image: mongo:7
    container_name: bdm-mongo-ventas
    ports:
      - "27019:27017"
    networks:
      - bdm-red
    volumes:
      - mongo_ventas:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

networks:
  bdm-red:
    name: bdm-red

volumes:
  mongo_personas:
  mongo_articulos:
  mongo_ventas:
